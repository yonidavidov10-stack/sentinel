name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `cache: pip` — it needs a requirements.txt or pyproject.toml, and
      # this project has neither ON PURPOSE: it depends on nothing outside the
      # standard library, so anything it can audit can run it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -q

      # A green pipeline running zero tests is worse than no pipeline: it
      # actively reports that the code is fine. pytest exits 0 when it collects
      # nothing, so the count is asserted rather than assumed.
      - name: Assert the suite was actually collected
        run: |
          COUNT=$(python -m pytest tests -q 2>&1 | sed -n 's/^\([0-9][0-9]*\) passed.*/\1/p')
          echo "Collected: ${COUNT:-0}"
          [ -n "$COUNT" ] && [ "$COUNT" -ge 25 ] || {
            echo "::error::Only ${COUNT:-0} tests ran (expected 25+)."; exit 1; }

      # The tool audits itself. If it cannot hold its own promises there is no
      # reason to believe what it says about anything else.
      - name: Audit itself
        run: python -m sentinel.cli run . --only intent
