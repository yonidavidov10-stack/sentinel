name: audit

# THE AUDITOR HAD NOBODY AUDITING IT.
#
# Every project sentinel watches sends its findings to @Bugfixer_BS7bot. This
# repository — the tool those findings come from — sent nothing. It checked
# itself only inside the improvement pass, as a gate that blocks a bad commit,
# which is useful and is not the same thing: a gate speaks to the pass, never
# to a person.
#
# So for three days its own improvement pass failed on a missing credential and
# the owner learned about it from a conversation, not from the bot. A tool whose
# entire purpose is catching gaps in monitoring was the one thing not monitored.

on:
  # AFTER THE DAEMON, NOT BEFORE IT. The improvement pass edits this repository;
  # auditing it beforehand inspects the version least likely to be broken. This
  # is the same ordering stock-predictor learned the hard way, where an audit at
  # 06:00 judged code the daemon rewrote at 06:40 and nobody heard about a
  # breakage for twenty-three hours.
  workflow_run:
    workflows: ["Self-improvement pass"]
    types: [completed]

  # And on its own, so a day the pass never ran is still reported. 07:40 UTC is
  # thirty minutes after improve.yml's 07:10 — nominally. Measured 2026-09-12,
  # GitHub creates scheduled runs three-and-a-half to five hours late, applied
  # unevenly, so this gap is an intention rather than a guarantee; the
  # workflow_run trigger above is what actually holds the order.
  schedule:
    - cron: "40 7 * * *"

  workflow_dispatch:

concurrency:
  group: audit
  cancel-in-progress: false

permissions:
  contents: write     # to keep the audit history
  actions: write      # to summon the daemon when something is really broken

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0        # the report names what the daemon changed

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install pytest

      - name: Is today the heartbeat day?
        id: hb
        # A bot that only ever speaks about problems is indistinguishable from
        # a bot that has stopped running. Once a week it says so explicitly.
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "flag=--heartbeat" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # THE TOOL AUDITS ITSELF, AND THAT IS THE DANGEROUS PART. Every other
      # project gets sentinel as a throwaway checkout it cannot break. Here the
      # thing being audited and the thing doing the auditing are one file tree,
      # so a pass that breaks the tool also breaks its own alarm — and silence
      # would read exactly like an all-clear.
      #
      # Hence `set +e` and the explicit outcome below: whether it ran at all is
      # recorded separately from what it found.
      - name: Audit itself, and report what is actionable
        id: audit
        env:
          BUGFIXER_BOT_TOKEN: ${{ secrets.BUGFIXER_BOT_TOKEN }}
          BUGFIXER_CHAT_IDS: ${{ secrets.BUGFIXER_CHAT_IDS }}
          # Without this, `gh run list` cannot authenticate and the CI-status
          # check reports UNKNOWN in every report — an unactionable line that
          # trains its reader to skim past the section real unknowns live in.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m sentinel.cli run . --telegram ${{ steps.hb.outputs.flag }}
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 0 = nothing actionable, 1 = a promise is broken, 2 = something
          # could not be checked, 3 = it ran and reached nobody. Anything else
          # means the tool did not run at all: a crash, an import error, a
          # syntax error a pass had just committed.
          case "$CODE" in
            0|1|2) echo "Audit ran (exit $CODE)." ;;
            3)
              # No Telegram message can report this one — the missing thing IS
              # the ability to send. A red run is the only channel left.
              echo "::error::The audit ran and reached nobody: BUGFIXER_BOT_TOKEN / BUGFIXER_CHAT_IDS are not set on this repository."
              exit 1 ;;
            *)     echo "::error::The auditor did not run (exit $CODE)." ;;
          esac

      # AN AUDIT THAT DID NOT RUN MUST NOT LOOK LIKE AN AUDIT THAT FOUND
      # NOTHING. That distinction is the whole discipline of this tool, and it
      # applies to the tool itself first. Sent directly with curl, because the
      # module that formats and sends messages is part of what may be broken.
      - name: Say so if the auditor could not run
        if: always() && steps.audit.outputs.code != '0' && steps.audit.outputs.code != '1' && steps.audit.outputs.code != '2' && steps.audit.outputs.code != '3'
        env:
          TOKEN: ${{ secrets.BUGFIXER_BOT_TOKEN }}
          CHATS: ${{ secrets.BUGFIXER_CHAT_IDS }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHATS" ] || exit 0
          for chat in ${CHATS//,/ }; do
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=🛠 <b>Bug Fixer</b>(sentinel)%0A%0A❗ <b>הבודק עצמו לא הצליח לרוץ.</b>%0A%0Aזו לא הודעה על ממצא — זו הודעה על כך שאי אפשר היה לבדוק כלום. סביר שפאס שיפור שבר את הכלי.%0A%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -o /dev/null
          done
          exit 1

      # FOUND AND FIXED, not found and filed. A broken promise found now would
      # otherwise wait for tomorrow's pass; the daemon reads the audit before it
      # does anything else, so a genuine ❌ summons it immediately.
      #
      # ONLY FROM THE CRON RUN. This workflow is also triggered by the daemon
      # finishing, and letting THAT summon the daemon would loop forever:
      # improve → audit → improve. Gating on `schedule` breaks the cycle.
      # SUMMON THE DAEMON ON WHAT IT CAN ACTUALLY FIX.
      #
      # This used to gate on `exit == 1`, a promise BROKEN. Every UNKNOWN and
      # every WARN exits 2 and woke nobody — so a finding could be reported
      # every morning for a week while the one thing able to act on it was
      # never told. The owner saw the same message daily and reasonably
      # concluded the system only reports.
      #
      # `--should-fix` answers a different question, in the exit code: is there
      # something here a pass could act on? A FAIL, yes, immediately. A WARN or
      # UNKNOWN only once it has RECURRED and is still open — one report is
      # information, five is a failure of the loop.
      #
      # And never for a finding marked `needs_owner`: rotating a credential,
      # plugging in a drive, editing a workflow the pass may not touch. Waking
      # it for work it is forbidden to do is how a fixing loop becomes an
      # expensive reporting loop.
      - name: Summon the daemon if there is something it can fix
        # NOT 'schedule' ONLY. The loop this must break is
        # improve → audit → improve, and that loop runs through `workflow_run`
        # — so blocking that one event is enough. Gating on `schedule` also
        # blocked `workflow_dispatch`, which meant the summon path could never
        # be exercised on demand, and a control nobody can run is a control
        # nobody has verified. Asked to prove the daemon wakes, the honest
        # answer was "I cannot make it try".
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python -m sentinel.cli run . --should-fix; then
            echo "::warning::Something here a pass can act on — starting one."
            gh workflow run improve.yml \
              || echo "::warning::Could not dispatch improve.yml; the scheduled pass will pick it up."
          else
            echo "Nothing a pass could fix. The daemon keeps its schedule."
          fi

      # ADVANCE THE HISTORY LEDGER, and only after a clean audit.
      #
      # THE HOLE THIS CLOSES. `_history_is_append_only` compares HEAD against
      # the commit the ledger names. Left un-advanced the ledger ages, and a
      # stale ledger only guards ANCIENT history: force-push away the last
      # five commits and a marker from thirty commits back is still an
      # ancestor, so the check passes and the rewrite goes unseen. Built
      # 2026-09-13, found un-wired the same day — the recorded marker was nine
      # commits behind by then, and the likeliest accident is exactly the one
      # it had stopped covering.
      #
      # AFTER, NOT BEFORE. Recording is a separate command from auditing for
      # this reason: a tool that updates the state it checks against, in the
      # same breath, overwrites the evidence while looking at it. Gated on the
      # audit having actually run — a crashed auditor must not be allowed to
      # bless the current HEAD on its way out.
      - name: Advance the history ledger
        if: always() && (steps.audit.outputs.code == '0' || steps.audit.outputs.code == '1' || steps.audit.outputs.code == '2')
        run: python -m sentinel.cli record .

      # The history is what `_recurring` and `_never_passed` read, so it has to
      # survive the runner. Committed rather than kept as an artifact: a plain
      # checkout must be able to read it, and artifacts expire.
      - name: Keep what was sent
        if: always()
        run: |
          [ -d .audit-history ] || exit 0
          # A BOT MUST NOT COMMIT UNDER THE OWNER'S ADDRESS. It did until
          # 2026-09-13, which made every automated commit indistinguishable
          # from a human one forged with `git commit --author` — the exact
          # thing commit signing exists to expose. The bot has no key and
          # cannot sign, so the only honest arrangement is for it to say who
          # it really is.
          #
          # noreply.github.com is reserved by GitHub for exactly this: it
          # resolves to no account and can never be mistaken for a person.
          git config user.name  "sentinel audit bot"
          git config user.email "sentinel-audit-bot@users.noreply.github.com"
          git add .audit-history .security
          git diff --cached --quiet && { echo "Nothing new to keep."; exit 0; }
          git commit -q -m "Audit history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push -q origin main && exit 0
            sleep 10
          done
          # Losing one history entry is not worth failing the audit: the message
          # already reached its reader, which is the part that matters.
          echo "::warning::Could not push the audit history."
